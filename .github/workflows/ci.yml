name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key_for_ci

  e2e:
    runs-on: ubuntu-latest
    # Playwright's own image ships the browsers and their system libraries
    # already installed, so this job neither downloads browsers nor runs apt.
    #
    # The previous approach cached ~/.cache/ms-playwright, which was the wrong
    # half of the problem: the browser download costs seconds, while
    # `install --with-deps` runs apt against an Ubuntu mirror and was measured
    # at 38s, 1m07s and 20m39s on three consecutive runs. A cache hit still ran
    # apt, so it could not fix the twenty-minute case.
    #
    # The tag must match the @playwright/test version in package.json.
    # tests/ciWorkflow.test.js asserts that, so the two cannot drift silently.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
      # Run as the runner's own user so checked-out files and written reports
      # are not left owned by root.
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Playwright starts its own dev server with placeholder Supabase creds
      # (see playwright.config.js), so no real credentials are needed here.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
