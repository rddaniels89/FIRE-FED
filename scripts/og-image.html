<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background:
      radial-gradient(900px 500px at 88% 8%, rgba(233,156,71,0.16), transparent 60%),
      linear-gradient(150deg, #1a2b55 0%, #0f172a 62%);
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 68px 72px;
    position: relative;
    overflow: hidden;
  }
  /* A restrained nod to the flame, kept well behind the type. */
  .glow {
    position: absolute;
    right: -140px;
    top: -160px;
    width: 620px;
    height: 620px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(216,134,53,0.22) 0%, transparent 68%);
  }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 800; letter-spacing: -0.01em; }
  .brand .mark { font-size: 40px; }
  h1 {
    font-size: 68px;
    font-weight: 800;
    line-height: 1.06;
    letter-spacing: -0.028em;
    max-width: 15ch;
  }
  h1 .accent { color: #f0b56d; }
  .sub { font-size: 27px; color: #b6cde6; font-weight: 400; margin-top: 24px; max-width: 44ch; line-height: 1.4; text-wrap: balance; }
  footer { display: flex; align-items: center; justify-content: space-between; font-size: 23px; color: #85a8d8; }
  .pills { display: flex; gap: 12px; }
  .pill {
    border: 1px solid rgba(182,205,230,0.28);
    border-radius: 999px;
    padding: 9px 20px;
    font-size: 21px;
    font-weight: 600;
    color: #d9e4f0;
  }
  .domain { font-weight: 600; color: #f8fafc; }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="brand"><span class="mark">🔥</span><span>FireFed</span></div>

  <div>
    <h1>Know what your <span class="accent">federal retirement</span> is actually worth.</h1>
    <p class="sub">Free FERS pension and Special Retirement Supplement calculators &mdash; no account needed.</p>
  </div>

  <footer>
    <div class="pills">
      <span class="pill">FERS</span>
      <span class="pill">TSP</span>
      <span class="pill">SRS</span>
    </div>
    <span class="domain">firefed.app</span>
  </footer>
</body>
</html>
